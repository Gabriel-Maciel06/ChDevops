apiVersion: '2021-10-01'
location: ${LOCATION}
name: ${CONTAINER_GROUP_NAME}
type: Microsoft.ContainerInstance/containerGroups
properties:
  osType: Linux
  restartPolicy: Always
  ipAddress:
    type: Public
    dnsNameLabel: ${DNS_LABEL}
    ports:
      - protocol: tcp
        port: 8080
        # NOTA: porta 1521 (Oracle) NÃO exposta publicamente.
        # A comunicação entre clyvo-api e clyvo-db ocorre via localhost compartilhado no Container Group.
        # Consultas SQL de evidência são feitas com: ./consultar_banco_nuvem.sh "SELECT ..." (az container exec).
  imageRegistryCredentials:
    - server: ${ACR_LOGIN_SERVER}
      username: ${ACR_USERNAME}
      password: ${ACR_PASSWORD}
  containers:
    - name: clyvo-db
      properties:
        image: ${ACR_LOGIN_SERVER}/${IMAGE_DB_NAME}
        resources:
          requests:
            cpu: 1.5
            memoryInGB: 3.0
        ports:
          - protocol: tcp
            port: 1521
        environmentVariables:
          - name: ORACLE_PASSWORD
            value: '${DB_PASSWORD}'
          - name: APP_USER
            value: '${DB_USER}'
          - name: APP_USER_PASSWORD
            value: '${DB_PASSWORD}'
    - name: clyvo-api
      properties:
        image: ${ACR_LOGIN_SERVER}/${IMAGE_APP_NAME}
        resources:
          requests:
            cpu: 1.0
            memoryInGB: 1.5
        ports:
          - protocol: tcp
            port: 8080
        environmentVariables:
          - name: DB_URL
            value: '${DB_URL}'
          - name: DB_USER
            value: '${DB_USER}'
          - name: DB_PASSWORD
            value: '${DB_PASSWORD}'
