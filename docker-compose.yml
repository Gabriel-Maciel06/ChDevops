# ==============================================================================
# Clyvo Vet - Ambiente local 100% containerizado (App + Oracle 23c Free)
# ------------------------------------------------------------------------------
# SEGURANÇA: nenhuma credencial fica neste arquivo. Copie .env.example para .env
# (arquivo ignorado pelo git) e defina DB_USER / DB_PASSWORD antes de subir:
#   cp .env.example .env && docker compose up --build -d
# As mesmas duas imagens (clyvo-api e clyvo-db) são enviadas ao ACR e executadas
# no ACI pelo script deploy_azure_acr_aci.sh.
# ==============================================================================
services:
  db:
    build:
      context: .
      dockerfile: db/Dockerfile
    image: clyvo-db:v1
    container_name: clyvo_db
    environment:
      - ORACLE_PASSWORD=${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      - APP_USER=${DB_USER:?Defina DB_USER no arquivo .env}
      - APP_USER_PASSWORD=${DB_PASSWORD}
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    networks:
      - clyvo_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30

  api:
    build: .
    image: clyvo-api:v1
    container_name: clyvo_api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:oracle:thin:@db:1521/FREEPDB1
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - clyvo_network
    restart: unless-stopped

volumes:
  oracle_data:
    name: oracle_data_volume

networks:
  clyvo_network:
    driver: bridge
