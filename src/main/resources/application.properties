spring.application.name=clyvo-api

# ==============================================================================
# SEGURANÇA: Credenciais injetadas via Variáveis de Ambiente / Azure Key Vault.
# NENHUM valor sensível possui fallback hardcoded neste arquivo.
# Em dev local, defina as vars no ambiente ou em .env (não commitar).
# ==============================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.initialization-fail-timeout=180000
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# JPA/Hibernate
# show-sql desabilitado em produção (evita vazamento de dados nos logs)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# Documentação Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Cache
spring.cache.type=concurrent
